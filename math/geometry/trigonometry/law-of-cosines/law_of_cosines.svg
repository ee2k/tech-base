<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1000" width="1920" height="1000" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Law of cosines from the intersecting chords theorem</title>
<style>.m{font-family:'STIX Two Text','Latin Modern Roman','Cambria','Times New Roman',serif;fill:#fff} .pl{fill:#aeb3c8} text.m{paint-order:stroke;stroke:#0a0a0f;stroke-width:6px;stroke-linejoin:round}</style>
<rect width="1920" height="1000" fill="#0a0a0f"/>
<circle cx="470" cy="510" r="400" fill="none" stroke="#b9739f" stroke-width="4"/>
<polygon points="70.0,510.0 870.0,510.0 359.7,125.5" fill="#8f7bff" fill-opacity=".13"/>
<polygon points="470.0,510.0 870.0,510.0 558.5,275.3" fill="#16405f"/>
<line x1="70" y1="510" x2="359.7" y2="125.5" stroke="#f4c95d" stroke-width="5" stroke-linecap="round"/>
<line x1="70" y1="510" x2="870" y2="510" stroke="#fff" stroke-width="4"/>
<line x1="328.8" y1="884.3" x2="611.2" y2="135.7" stroke="#ef6a58" stroke-width="5" stroke-linecap="round"/>
<line x1="870" y1="510" x2="359.7" y2="125.5" stroke="#5cc3e8" stroke-width="5" stroke-linecap="round"/>
<path d="M790.0,510.0 A80 80 0 0 1 806.1,461.9" fill="none" stroke="#fff" stroke-width="3"/>
<polyline points="340.5,151.1 366.0,170.3 385.3,144.8" fill="none" stroke="#fff" stroke-width="3"/>
<g fill="#fff"><circle cx="470" cy="510" r="6"/><circle cx="558.5" cy="275.3" r="6"/><circle cx="359.7" cy="125.5" r="6"/><circle cx="870" cy="510" r="6"/><circle cx="70" cy="510" r="6"/></g>
<text transform="translate(367.6 685.1) rotate(-69.33)" text-anchor="middle" dy=".35em" font-size="38" class="m"><tspan font-style="italic">a</tspan></text>
<text transform="translate(482.5 380.6) rotate(-69.33)" text-anchor="middle" dy=".35em" font-size="38" class="m"><tspan font-style="italic">c</tspan></text>
<text transform="translate(616.7 217.5) rotate(-69.33)" text-anchor="middle" dy=".35em" font-size="38" class="m"><tspan font-style="italic">a</tspan><tspan font-style="normal"> − </tspan><tspan font-style="italic">c</tspan></text>
<text transform="translate(734.7 365.5) rotate(37.00)" text-anchor="middle" dy=".35em" font-size="38" class="m"><tspan font-style="italic">b</tspan></text>
<text transform="translate(479.6 173.2) rotate(37.00)" text-anchor="middle" dy=".35em" font-size="38" class="m"><tspan font-style="normal">2</tspan><tspan font-style="italic">a</tspan><tspan font-style="normal"> cos </tspan><tspan font-style="italic">θ</tspan><tspan font-style="normal"> − </tspan><tspan font-style="italic">b</tspan></text>
<text x="270.0" y="548" text-anchor="middle" font-size="38" class="m"><tspan font-style="italic">a</tspan></text>
<text x="670.0" y="548" text-anchor="middle" font-size="38" class="m"><tspan font-style="italic">a</tspan></text>
<text x="763.8" y="474.5" text-anchor="middle" dy=".35em" font-size="38" class="m"><tspan font-style="italic">θ</tspan></text>
<text x="40.0" y="520.0" text-anchor="middle" font-size="30" class="m pl"><tspan font-style="italic">L</tspan></text><text x="900.0" y="520.0" text-anchor="middle" font-size="30" class="m pl"><tspan font-style="italic">R</tspan></text><text x="333.7" y="113.5" text-anchor="middle" font-size="30" class="m pl"><tspan font-style="italic">Q</tspan></text><text x="492.0" y="546.0" text-anchor="middle" font-size="30" class="m pl"><tspan font-style="italic">O</tspan></text><text x="528.5" y="283.3" text-anchor="middle" font-size="30" class="m pl"><tspan font-style="italic">P</tspan></text>
<text x="960" y="170" font-size="38" font-family="'Inter','Helvetica Neue',Arial,sans-serif" fill="#fff">The intersecting chords theorem implies that</text>
<text x="960" y="275" font-size="58" class="m" fill="#fff"><tspan fill="#ef6a58"><tspan font-style="normal">(</tspan><tspan font-style="italic">a</tspan><tspan font-style="normal"> + </tspan><tspan font-style="italic">c</tspan><tspan font-style="normal">)(</tspan><tspan font-style="italic">a</tspan><tspan font-style="normal"> − </tspan><tspan font-style="italic">c</tspan><tspan font-style="normal">)</tspan></tspan><tspan> = </tspan><tspan fill="#5cc3e8"><tspan font-style="italic">b</tspan><tspan font-style="normal">(2</tspan><tspan font-style="italic">a</tspan><tspan font-style="normal"> cos </tspan><tspan font-style="italic">θ</tspan><tspan font-style="normal"> − </tspan><tspan font-style="italic">b</tspan><tspan font-style="normal">)</tspan></tspan></text>
<text x="960" y="326" font-size="27" font-family="'Inter','Helvetica Neue',Arial,sans-serif" fill="#8e93a8">LR is a diameter, so ∠LQR = 90° and RQ = 2a cos θ.</text>
<text x="960" y="440" font-size="34" font-family="'Inter','Helvetica Neue',Arial,sans-serif" fill="#8e93a8">Simplifying</text>
<text x="960" y="530" font-size="52" class="m" fill="#fff"><tspan font-style="italic">a</tspan><tspan font-style="normal">² − </tspan><tspan font-style="italic">c</tspan><tspan font-style="normal">² = 2</tspan><tspan font-style="italic">ab</tspan><tspan font-style="normal"> cos </tspan><tspan font-style="italic">θ</tspan><tspan font-style="normal"> − </tspan><tspan font-style="italic">b</tspan><tspan font-style="normal">²</tspan></text>
<text x="960" y="682" font-size="27" font-family="'Inter','Helvetica Neue',Arial,sans-serif" fill="#fff">Rearrange it, the law of cosines</text>
<rect x="940" y="742" width="700" height="100" fill="none" stroke="#fff" stroke-width="3"/>
<text x="960" y="815" font-size="56" class="m" fill="#fff"><tspan font-style="italic">c</tspan><tspan font-style="normal">² = </tspan><tspan font-style="italic">a</tspan><tspan font-style="normal">² + </tspan><tspan font-style="italic">b</tspan><tspan font-style="normal">² − 2</tspan><tspan font-style="italic">ab</tspan><tspan font-style="normal"> cos </tspan><tspan font-style="italic">θ</tspan></text>
</svg>